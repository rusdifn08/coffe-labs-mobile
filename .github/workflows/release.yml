name: Build & Publish Release (.APK & .IPA)

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. BUILD COMPRESSED ANDROID APKS (Split-per-ABI & Universal)
  # =========================================================================
  build-android:
    name: Build Android APKs (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      - name: Decode Release Keystore
        # WAJIB. Tanpa keystore asli, build.gradle.kts akan jatuh ke fallback
        # debug keystore (~/.android/debug.keystore) dan APK release akan
        # ditandatangani dengan kunci debug AOSP. Itu membuat APK dinilai
        # tidak tepercaya oleh Google Play Protect dan memblokir instalasi.
        # Kredensial disimpan sebagai GitHub Secrets (base64 dari file .jks).
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 kosong. Build akan memakai debug keystore dan Play Protect akan memblokir APK. Abort."
            exit 1
          fi
          mkdir -p android/app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=upload-keystore.jks
          EOF
          echo "Keystore siap: $(ls -l android/app/upload-keystore.jks | awk '{print $5}') bytes"

      - name: Install Dependencies
        run: flutter pub get

      - name: "Build Compressed Split-per-ABI APKs (flavor: store)"
        # Flavor `store` = build PUBLIK. Tidak memuat notification-listener
        # bank, tidak memuat APK installer. Ini yang lulus Play Protect.
        # Build `merchant` (internal toko) dibangun terpisah, JANGAN dipublikasikan.
        run: |
          set -euo pipefail
          flutter build apk --flavor store --release \
            --target-platform android-arm64 --split-per-abi
          mkdir -p dist-android
          cp build/app/outputs/flutter-apk/app-store-arm64-v8a-release.apk dist-android/Coffe_Labs_25.apk

      - name: Verify Signature & Manifest Posture (GATE)
        # Gerbang mutlak: kalau APK masih debug-signed atau masih membawa
        # permission berisiko, job GAGAL dan tidak ada yang dipublikasikan.
        run: |
          set -euo pipefail
          APK=dist-android/Coffe_Labs_25.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "=== Sertifikat penanda tangan ==="
          "$BT/apksigner" verify --print-certs "$APK"
          if "$BT/apksigner" verify --print-certs "$APK" | grep -qi "CN=Android Debug"; then
            echo "::error::APK masih debug-signed (CN=Android Debug). Play Protect akan memblokir."
            exit 1
          fi
          echo "=== Permission berisiko harus ABSEN ==="
          "$BT/aapt2" dump permissions "$APK" > /tmp/perms.txt || true
          cat /tmp/perms.txt
          for bad in REQUEST_INSTALL_PACKAGES SYSTEM_ALERT_WINDOW READ_PHONE_STATE; do
            if grep -q "android.permission.$bad" /tmp/perms.txt; then
              echo "::error::Permission $bad masih ada di APK publik. Play Protect akan memblokir."
              exit 1
            fi
          done
          echo "=== Lolos gate Play Protect ==="

      - name: Verify Direct Download APK Assets
        run: |
          ls -lh dist-android/

      - name: Upload Android Release Assets
        uses: actions/upload-artifact@v4
        with:
          name: android-release-assets
          path: dist-android/*.apk
          retention-days: 7

  # =========================================================================
  # 2. BUILD COMPRESSED IOS PACKAGE (.ipa)
  # =========================================================================
  build-ios:
    name: Build iOS Package (.ipa)
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      - name: Install Dependencies & CocoaPods
        run: |
          flutter pub get
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS Release (No Code Signing)
        run: flutter build ios --release --no-codesign

      - name: Package Payload into Compressed IPA (.ipa)
        run: |
          mkdir -p dist-ios
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -9 -r ../../../dist-ios/CoffeLabs25.ipa Payload
          cd ../../..

      - name: Upload iOS Release Asset
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-assets
          path: dist-ios/*.ipa
          retention-days: 7

  # =========================================================================
  # 3. CREATE GITHUB RELEASE (DIRECT DOWNLOAD .APK & .IPA, NO .ZIP)
  # =========================================================================
  publish-github-release:
    name: Publish GitHub Release (Direct Download)
    needs: [build-android, build-ios]
    if: always() && (needs.build-android.result == 'success' || needs.build-ios.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Download Android APK Assets
        if: needs.build-android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: android-release-assets
          path: release-files

      - name: Download iOS IPA Asset
        if: needs.build-ios.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: ios-release-assets
          path: release-files

      - name: Determine Release Tag
        id: release_info
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v2.5.0"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=Coffee Labs App Release $TAG" >> $GITHUB_OUTPUT

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          draft: false
          prerelease: false
          body: |
            ## ☕ Coffee Labs Mobile Release v2.4.0
            
            Unduh file aplikasi secara langsung tanpa kompresi `.zip`:
            
            ### 📱 Android (.apk):
            - **`CoffeeLabs-arm64-v8a.apk`** *(Direkomendasikan - Ukuran Terkompresi Lebih Hemat untuk Smartphone Modern)*
            - **`CoffeeLabs-Universal.apk`** *(Universal - Kompatibel dengan Semua Arsitektur Android)*
            - **`CoffeeLabs-armeabi-v7a.apk`** *(Perangkat Android 32-bit)*
            - **`CoffeeLabs-x86_64.apk`** *(Emulator Android & Perangkat x86_64)*
            
            ### 🍏 iOS (.ipa):
            - **`CoffeeLabs-iOS-Release.ipa`** *(Format `.ipa` terkompresi untuk sideloading via AltStore, Sideloadly, TrollStore, atau Scarlet)*

            ### ✨ Apa yang Baru di v2.4.0:
            - 🎮 **3D Interactive V60 Brew Studio & Gyroscope Physics**: Simulasi penyeduhan V60 3D interaktif dengan sensor gyroscope, bilas kertas filter, teko leher angsa presisi, dan telemetri aliran air.
            - 📚 **LMS Manual Brew Academy & DRM Offline E-Book**: Kurikulum lengkap Manual Brew dengan unduhan E-Book on-demand (hemat ukuran APK, dapat dibaca 100% offline).
            - 🛡️ **Admin Trial 7-Day Full Access (Non-Business) & Recipe Lock Security**: Panel kontrol Admin untuk kebijakan Trial 7 Hari Full Access, perbaikan keamanan lock resep saat filter/search, dan sistem share kartu resep lintas sosial media.
            - ❄️ **18 Brew Methods Audit & Background Cold Brew Alarm**: Audit kurasi 18 metode seduh dan sistem pengingat latar belakang untuk ekstraksi Cold Brew.
          files: release-files/*.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
