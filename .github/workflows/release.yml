name: Build & Publish Release (.APK & .IPA)

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. BUILD COMPRESSED ANDROID APKS (Split-per-ABI & Universal)
  # =========================================================================
  build-android:
    name: Build Android APKs (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Android Debug/CI Keystore
        run: |
          mkdir -p ~/.android ~/.config/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CoffeeLabs,O=CoffeeLabs,C=ID"
          cp ~/.android/debug.keystore ~/.config/.android/debug.keystore

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Compressed Split-per-ABI APKs
        run: |
          flutter build apk --release --split-per-abi
          mkdir -p dist-android
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist-android/CoffeeLabs-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist-android/CoffeeLabs-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist-android/CoffeeLabs-x86_64.apk

      - name: Build Universal Release APK
        run: |
          flutter build apk --release
          mkdir -p dist-android
          cp build/app/outputs/flutter-apk/app-release.apk dist-android/CoffeeLabs-Universal.apk

      - name: Verify Direct Download APK Assets
        run: |
          ls -lh dist-android/

      - name: Upload Android Release Assets
        uses: actions/upload-artifact@v4
        with:
          name: android-release-assets
          path: dist-android/*.apk
          retention-days: 7

  # =========================================================================
  # 2. BUILD COMPRESSED IOS PACKAGE (.ipa)
  # =========================================================================
  build-ios:
    name: Build iOS Package (.ipa)
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies & CocoaPods
        run: |
          flutter pub get
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS Release (No Code Signing)
        run: flutter build ios --release --no-codesign

      - name: Package Payload into Compressed IPA (.ipa)
        run: |
          mkdir -p dist-ios
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -9 -r ../../../dist-ios/CoffeeLabs-iOS-Release.ipa Payload
          cd ../../..

      - name: Upload iOS Release Asset
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-assets
          path: dist-ios/*.ipa
          retention-days: 7

  # =========================================================================
  # 3. CREATE GITHUB RELEASE (DIRECT DOWNLOAD .APK & .IPA, NO .ZIP)
  # =========================================================================
  publish-github-release:
    name: Publish GitHub Release (Direct Download)
    needs: [build-android, build-ios]
    if: always() && (needs.build-android.result == 'success' || needs.build-ios.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Download Android APK Assets
        if: needs.build-android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: android-release-assets
          path: release-files

      - name: Download iOS IPA Asset
        if: needs.build-ios.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: ios-release-assets
          path: release-files

      - name: Determine Release Tag
        id: release_info
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v2.1.0-$(date +'%Y%m%d-%H%M')"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=Coffee Labs App Release $TAG" >> $GITHUB_OUTPUT

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          draft: false
          prerelease: false
          body: |
            ## ☕ Coffee Labs Mobile Release v2.1.0
            
            Unduh file aplikasi secara langsung tanpa kompresi `.zip`:
            
            ### 📱 Android (.apk):
            - **`CoffeeLabs-arm64-v8a.apk`** *(Direkomendasikan - Ukuran Terkompresi ~80MB Lebih Hemat untuk Smartphone Modern)*
            - **`CoffeeLabs-Universal.apk`** *(Universal - Kompatibel dengan Semua Arsitektur Android)*
            - **`CoffeeLabs-armeabi-v7a.apk`** *(Perangkat Android 32-bit)*
            - **`CoffeeLabs-x86_64.apk`** *(Emulator Android & Perangkat x86_64)*
            
            ### 🍏 iOS (.ipa):
            - **`CoffeeLabs-iOS-Release.ipa`** *(Format `.ipa` terkompresi untuk sideloading via AltStore, Sideloadly, TrollStore, atau Scarlet)*

            ### ✨ Apa yang Baru di v2.1.0:
            - 🔬 **Lab Ekstraksi & AI**: Pengelompokan baru yang intuitif untuk Smart Brew AI, Studio AI, Dial-In Assistant, Matriks Grinder, Kalkulator 4:6, dan Ekstraksi TDS & Golden Cup.
            - 🧠 **Studio Pelatihan AI (On-Device Few-Shot Transfer Learning)**: Latih model AI mengenali kemasan kopi baru dengan alur foto terpandu (Depan, Kiri, Kanan).
            - ⛰️ **Precision MDPL Stepper**: Pengaturan elevasi praktis `+50` / `-50` MDPL (default: 1200 - 1600 MDPL).
            - 🎨 **Bespoke Vector SVG Icons**: Ikon vektor presisi kustom untuk setiap alat ekstraksi kopi.
            - 🚀 **Fluid Portal Login Animation**: Transisi login mulus dengan auto-retry untuk serverless database Neon.
            - 📐 **Zero Layout Overflow**: Desain card yang responsif dan bebas overflow di semua resolusi layar.
          files: release-files/*.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
