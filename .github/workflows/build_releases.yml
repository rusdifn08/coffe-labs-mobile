name: Build Android APK & iOS Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Compressed Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Compressed Split-per-ABI APKs
        run: |
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols

      - name: Build Universal Release APK
        run: |
          flutter build apk --release

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coffee-labs-android-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14

  build-ios:
    name: Build iOS App & Payload (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Release (No Code Signing)
        run: |
          flutter build ios --release --no-codesign

      - name: Package Payload into unsigned IPA
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r CoffeLabs-unsigned.ipa Payload
          cd ../../..

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coffee-labs-ios-ipa
          path: build/ios/iphoneos/CoffeLabs-unsigned.ipa
          retention-days: 14
